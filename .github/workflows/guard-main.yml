name: Guard main

# SECURITY: pull_request_target runs in the base branch context with write
# permissions. Never add `actions/checkout` or run any code from the PR here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited]

permissions:
  pull-requests: write

jobs:
  check-pr-target:
    name: Check PR routing policy
    runs-on: ubuntu-latest
    if: >
      github.event.action != 'edited' ||
      github.event.changes.base.ref.from != ''

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Check if PR is from an allowed branch
        id: check
        run: |
          if [[ "$HEAD_REPO" == "$REPO" ]] && \
             [[ "$HEAD_REF" == "staging" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post warning on policy violation
        if: steps.check.outputs.allowed == 'false'
        continue-on-error: true
        run: |
          MARKER="<!-- guard-main-routing-warning -->"

          EXISTING="$(
            gh api \
              "repos/$REPO/issues/$PR_NUMBER/comments" \
              --paginate \
              --jq ".[] | select(.body | contains(\"$MARKER\")) | .id"
          )"

          if [[ -n "$EXISTING" ]]; then
            exit 0
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "$MARKER
          ⚠️ **Warning:** This PR targets \`main\` directly.

          **Preferred workflow:** feature → staging → main

          If this is a hotfix, proceed, just make sure to back-merge into \`staging\` after it lands.

          **Otherwise:** Please close this PR and open it against \`staging\` instead."
